name: Release

on:
  push:
    tags:
      - 'v*'

# The three build jobs run untrusted third-party code — npm packages, Go
# modules, the Wails CLI — and only need to read the repository. Write access is
# granted to the `release` job alone, which is what publishes the signed assets,
# so a compromised build dependency cannot rewrite the repository or tamper with
# an existing release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
          - os: ubuntu-latest
            platform: linux/amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so a release is built with the toolchain the project
          # actually pins rather than whatever '1.25' resolves to that day.
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # Pinned to the version in go.mod. The CLI generates the bridge
        # bindings and drives the build, so letting it float means a future
        # release can change the output — or drift from the library it is
        # generating against — with nothing in this repository changing.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Windows: install NSIS for installer
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y
        shell: pwsh

      # Build
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X SnmpLens/pkg/updater.Version=${{ github.ref_name }}"

      - name: Build (non-Linux)
        if: runner.os != 'Linux'
        run: wails build -platform ${{ matrix.platform }} -ldflags "-X SnmpLens/pkg/updater.Version=${{ github.ref_name }}"

      # ── Windows packaging ──

      - name: Build NSIS Installer
        if: runner.os == 'Windows'
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content build\windows\installer\project.nsi) -replace '1\.0\.0', $version | Set-Content build\windows\installer\project.nsi
          makensis build\windows\installer\project.nsi
        shell: pwsh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path build/bin/SnmpLens.exe -DestinationPath SnmpLens-windows-amd64-portable.zip
          Move-Item "SnmpLens-${version}-setup.exe" "SnmpLens-windows-amd64-setup.exe"
          # Raw executable for the in-app self-update path
          Copy-Item build/bin/SnmpLens.exe SnmpLens-windows-amd64.exe
        shell: pwsh

      # ── macOS packaging ──

      - name: Package (macOS .zip)
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r ../../SnmpLens-macos-universal.zip SnmpLens.app

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-stage
          cp -R build/bin/SnmpLens.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "SnmpLens" -srcfolder dmg-stage -ov -format UDZO SnmpLens-macos-universal.dmg

      # ── Linux packaging ──

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          tar -czf SnmpLens-linux-amd64.tar.gz -C build/bin SnmpLens
          # Raw binary for the in-app self-update path
          cp build/bin/SnmpLens SnmpLens-linux-amd64

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/local/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps

          cp build/bin/SnmpLens deb-pkg/usr/local/bin/snmplens
          chmod 755 deb-pkg/usr/local/bin/snmplens

          cp SnmpLens.png deb-pkg/usr/share/icons/hicolor/256x256/apps/snmplens.png

          cat > deb-pkg/DEBIAN/control << EOF
          Package: snmplens
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: Geoffrey Lecoq
          Description: SNMP MIB Browser and Network Management Tool
           A modern desktop application for SNMP operations, MIB browsing,
           trap listening, network discovery, and real-time monitoring.
          EOF
          sed -i 's/^          //' deb-pkg/DEBIAN/control

          cat > deb-pkg/usr/share/applications/snmplens.desktop << EOF
          [Desktop Entry]
          Name=SnmpLens
          Comment=SNMP MIB Browser and Network Management
          Exec=/usr/local/bin/snmplens
          Icon=snmplens
          Type=Application
          Categories=Network;System;Monitor;
          Terminal=false
          EOF
          sed -i 's/^          //' deb-pkg/usr/share/applications/snmplens.desktop

          dpkg-deb --build deb-pkg "SnmpLens-linux-amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnmpLens-${{ runner.os }}
          path: |
            SnmpLens-*.zip
            SnmpLens-*.tar.gz
            SnmpLens-*-setup.exe
            SnmpLens-windows-amd64.exe
            SnmpLens-linux-amd64
            SnmpLens-*.dmg
            SnmpLens-*.deb

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: id-token for the OIDC token that proves the
      # attestation came from this workflow run, attestations to record it.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so a release is built with the toolchain the project
          # actually pins rather than whatever '1.25' resolves to that day.
          go-version-file: go.mod

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # SHA-256 manifest consumed by the in-app updater to verify downloads.
      #
      # The first line BINDS the manifest to this tag, and the updater refuses
      # one that names a different release. Without it the signature answers
      # only "did we sign this?", which an OLD manifest also satisfies — so
      # anyone able to serve what the app fetches could hand back a previous
      # release's manifest and binaries and have every check pass while an
      # older, possibly vulnerable, version is installed.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          {
            echo "version ${GITHUB_REF_NAME}"
            sha256sum SnmpLens-windows-* SnmpLens-macos-* SnmpLens-linux-*
          } > SnmpLens-checksums.txt
          cat SnmpLens-checksums.txt

      # Ed25519-sign the manifest so the updater can authenticate it against the
      # public key embedded in the app.
      #
      # REQUIRED, not best-effort. `updatersign` prints a notice and exits 0
      # when the key is absent, which is right for a local build and wrong here:
      # a key that quietly failed to reach the runner would publish an unsigned
      # release, and the app — which has a public key embedded and therefore
      # enforces the signature — would refuse every update from it. That is a
      # broken release nobody notices until someone tries to update.
      - name: Sign checksums
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::UPDATER_PRIVATE_KEY is not set; releases must be signed." >&2
            exit 1
          fi
          go run ./tools/updatersign sign artifacts/SnmpLens-checksums.txt
          test -s artifacts/SnmpLens-checksums.txt.sig

      # Signed, verifiable provenance for every published asset: which workflow,
      # which commit, which runner produced these exact bytes. It answers a
      # question the Ed25519 manifest signature does not — that signature proves
      # the checksums were signed by the holder of the release key, not that the
      # binaries were built from this repository by this workflow.
      #
      # Checkable without trusting anything in this repository:
      #   gh attestation verify SnmpLens-windows-amd64.exe --repo Wasabules/SnmpLens
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/SnmpLens-windows-amd64.exe
            artifacts/SnmpLens-windows-amd64-setup.exe
            artifacts/SnmpLens-windows-amd64-portable.zip
            artifacts/SnmpLens-macos-universal.dmg
            artifacts/SnmpLens-macos-universal.zip
            artifacts/SnmpLens-linux-amd64
            artifacts/SnmpLens-linux-amd64.deb
            artifacts/SnmpLens-linux-amd64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/SnmpLens-windows-amd64-portable.zip
            artifacts/SnmpLens-windows-amd64-setup.exe
            artifacts/SnmpLens-windows-amd64.exe
            artifacts/SnmpLens-macos-universal.zip
            artifacts/SnmpLens-macos-universal.dmg
            artifacts/SnmpLens-linux-amd64.tar.gz
            artifacts/SnmpLens-linux-amd64.deb
            artifacts/SnmpLens-linux-amd64
            artifacts/SnmpLens-checksums.txt
            artifacts/SnmpLens-checksums.txt.sig

  # Auto-submit the updated manifest to microsoft/winget-pkgs after the release
  # assets are published. Enable once the package's first manifest has been
  # merged: set repo variable WINGET_ENABLED=true and secret WINGET_TOKEN
  # (a classic PAT with public_repo scope). Until then this job is skipped.
  winget:
    needs: release
    if: ${{ vars.WINGET_ENABLED == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Submit updated manifest to winget-pkgs
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $installer = "https://github.com/${{ github.repository }}/releases/download/$tag/SnmpLens-windows-amd64-setup.exe"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Wasabules.SnmpLens `
            --version $version `
            --urls "$installer" `
            --submit `
            --token "${{ secrets.WINGET_TOKEN }}"
