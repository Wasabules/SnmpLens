<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />

<title>Not found — SnmpLens</title>

<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<script>
/* Stamp the chosen theme on <html> BEFORE the stylesheet is parsed.
   Synchronous and inline on purpose: anything deferred paints one theme and
   then corrects it, which is the flash this exists to prevent. Absent or
   unreadable storage means "follow the system", which is the default the
   stylesheet already implements — so this does nothing at all for most
   readers, and that is the correct amount. */
try {
  var t = localStorage.getItem('snmplens-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">

      <a href="/documentation.html">Documentation</a>
      <a href="/download.html">Download</a>
      <div data-theme-toggle hidden></div>
    </nav>
  </div>
</header>

<main class="wrap wrap-narrow" style="padding-block:6rem 8rem">
  <p class="eyebrow">404</p>
  <h1 style="margin-bottom:0.4em">No such page.</h1>
  <p class="lede">
    The nearest known ancestor is the front page — which, as it happens, is exactly what an
    SNMP lookup for an unknown OID returns instead of failing.
  </p>
  <div class="btn-row" style="margin-top:2rem">
    <a class="btn btn-primary" href="/">Front page</a>
    <a class="btn" href="/documentation.html">Documentation</a>
    <a class="btn" href="https://github.com/Wasabules/SnmpLens">Repository</a>
  </div>
</main>

<footer class="site-footer">

    <div class="colophon" style="margin-top:0; border-top:0; padding-top:0">
      <p>© 2026 Geoffrey Lecoq · Released under the MIT licence.</p>
    </div>
  </div>
</footer>

<script src="/assets/site.js" defer></script>
</body>
</html>
